indexpage:
  title: NetApp Workload Factory Dokumentation
  summary: Mit NetApp Workload Factory holen Sie das Beste aus Ihren Cloud Storage-Workloads
    heraus. Nach Abschluss der Einrichtung können Sie Ihre Storage-Systeme für Ihre
    Workloads erstellen, optimieren und managen, Kosteneinsparungen erschließen, den
    integrierten Infrastructure-as-Code-Copiloten für die plattformübergreifende Automatisierung
    nutzen und Ihre Workloads in Workload Factory managen.
  keywords: Workload Factory, fsx, account, credentials, users, permissions, log in,
    calculator, codebox
  lead: Mit NetApp Workload Factory lässt sich das Potenzial Ihrer Workloads bei der
    Nutzung von Amazon FSx for NetApp ONTAP und OCI NetApp Storage Service optimal
    ausschöpfen. Nach Abschluss der Einrichtung können Sie FSx for ONTAP Dateisysteme
    für Ihre Workloads erstellen, optimieren und managen, Kosteneinsparungen mit FSx
    for ONTAP analysieren, den integrierten Infrastructure-as-Code Co-Piloten für
    die plattformübergreifende Automatisierung nutzen und Ihre Workloads in Workload
    Factory managen.
